    <main>
        <div class="filters">

            <select id="category-filter">

                <option value="FPS">FPS</option>
                <option value="RPG">RPG</option>
                <option value="survivalhorror">Survival Horror</option>
                <option value="sandbox">Sandbox</option>

                <option value="story">Story</option>
                <option value="strategy">Strategy</option>
                <option value="soulslike">Soulslike</option>
            </select>
        </div>
		
		<h2 style="color: #fff; background-color: #333; text-align: center; padding: 0.5em 0; margin-bottom: 10px; border: 1px solid yellow; border-radius: 5px;">Our Picks</h2>

        <div class="suggestions-grid">
            <div class="suggestion" data-category="RPG" data-name="Assassin's Creed Shadows" data-description="Experience an epic action-adventure story set in feudal Japan! Become a lethal shinobi assassin and powerful legendary samurai as you explore a beautiful open world in a time of chaos." data-price="£59.99" data-platforms="PC, PS5, Xbox Series X/S">
                <img src="Thumbnails/acshadows.jpg" alt="Assassin's Creed Shadows">
            </div>
            <div class="suggestion" data-category="RPG" data-name="Black Myth: Wukong" data-description= "Black Myth: Wukong is an action RPG rooted in Chinese mythology. You shall set out as the Destined One to venture into the challenges and marvels ahead, to uncover the obscured truth beneath the veil of a glorious legend from the past." data-price="£49.99" data-platforms="PC, PS5, Xbox Series X/S">
                <img src="Thumbnails/blackmythwukong.jpg" alt="Black Myth: Wukong">
            </div>
            <div class="suggestion" data-category="FPS" data-name="Counter-Strike 2" data-description="For over two decades, Counter-Strike has offered an elite competitive experience, one shaped by millions of players from across the globe. And now the next chapter in the CS story is about to begin. This is Counter-Strike 2." data-price="Free" data-platforms="PC">
                <img src="Thumbnails/cs2.jpg" alt="Counter-Strike 2">
            </div>
            <div class="suggestion" data-category="survivalhorror" data-name="Dead Space" data-description="The sci-fi survival-horror classic returns, completely rebuilt to offer an even more immersive experience — including visual, audio, and gameplay improvements — while staying faithful to the original game’s thrilling vision." data-price="£49.99" data-platforms="PC, PS5, Xbox Series X/S">
                <img src="Thumbnails/deadspace.jpg" alt="Dead Space">
            </div>
            <div class="suggestion" data-category="FPS" data-name="DOOM Eternal" data-description="Hell’s armies have invaded Earth. Become the Slayer in an epic single-player campaign to conquer demons across dimensions and stop the final destruction of humanity. The only thing they fear... is you." data-price="£34.99" data-platforms="PC, PS4, Xbox One, Nintendo Switch">
                <img src="Thumbnails/doom.jpg" alt="DOOM Eternal">
            </div>
            <div class="suggestion" data-category="RPG soulslike" data-name="Elden Ring" data-description="THE CRITICALLY ACCLAIMED FANTASY ACTION RPG. Rise, Tarnished, and be guided by grace to brandish the power of the Elden Ring and become an Elden Lord in the Lands Between." data-price="£49.99" data-platforms="PC, PS4, PS5, Xbox One, Xbox Series X/S">
                <img src="Thumbnails/eldenring.jpg" alt="Elden Ring">
            </div>
            <div class="suggestion" data-category="strategy" data-name="Hearts of Iron IV" data-description="Victory is at your fingertips! Your ability to lead your nation is your supreme weapon, the strategy game Hearts of Iron IV lets you take command of any nation in World War II; the most engaging conflict in world history." data-price="£41.99" data-platforms="PC">
                <img src="Thumbnails/heartsofiron.jpg" alt="Hearts of Iron IV">
            </div>
            <div class="suggestion" data-category="sandbox" data-name="Minecraft" data-description="CREATE. Build whatever you can imagine in your own infinite world that’s unique in every playthrough. EXPLORE. Discover biomes, resources and mobs, and craft your way through a world filled with surprises in the ultimate sandbox game. SURVIVE. Experience unforgettable adventures as you face mysterious foes, traverse exciting landscapes, and travel to perilous dimensions." data-price="£24.99" data-platforms="PC, PS4, PS5, Xbox One, Xbox Series X/S, Nintendo Switch, Mobile">
                <img src="Thumbnails/minecraft.jpg" alt="Minecraft">
            </div>
            <div class="suggestion" data-category="story RPG" data-name="OMORI" data-description="Explore a strange world full of colorful friends and foes. When the time comes, the path you’ve chosen will determine your fate... and perhaps the fate of others as well." data-price="£15.49" data-platforms="PC, PS4, Xbox One, Nintendo Switch">
                <img src="Thumbnails/omori.jpg" alt="OMORI">
            </div>
            <div class="suggestion" data-category="puzzle story" data-name="Portal 2" data-description="The 'Perpetual Testing Initiative' has been expanded to allow you to design co-op puzzles for you and your friends!" data-price="£8.50" data-platforms="PC, PS3, Xbox 360, Nintendo Switch">
                <img src="Thumbnails/portal2.jpg" alt="Portal 2">
            </div>
            <div class="suggestion" data-category="RPG" data-name="The Elder Scrolls V: Skyrim" data-description="Winner of more than 200 Game of the Year Awards, The Elder Scrolls V: Skyrim Special Edition brings the epic fantasy to life in stunning detail. The Special Edition includes the critically acclaimed game and add-ons with all-new features." data-price="£34.99" data-platforms="PC, PS3, PS4, PS5, Xbox 360, Xbox One, Xbox Series X/S, Nintendo Switch">
                <img src="Thumbnails/skyrim.jpg" alt="The Elder Scrolls V: Skyrim">
            </div>
            <div class="suggestion" data-category="FPS" data-name="ULTRAKILL" data-description="ULTRAKILL is a fast-paced ultraviolent retro FPS combining the skill-based style scoring from character action games with unadulterated carnage inspired by the best shooters of the '90s. Rip apart your foes with varied destructive weapons and shower in their blood to regain your health." data-price="£20.99" data-platforms="PC">
                <img src="Thumbnails/ultrakill.jpg" alt="ULTRAKILL">
            </div>
