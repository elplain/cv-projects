<!-- Popup Element -->
<div id="thank-you-popup" style="display:none;">
  <p>Thank you for leaving a review!</p>
  <button id="close-popup">Close</button>
</div>

<!-- jQuery Script Block -->
<script>
  $(document).ready(function(){
    // When any review form is submitted
    $('.review-form').on('submit', function(e) {
      e.preventDefault(); // Prevent the default form submission
      
      
      
      // Show the thank you popup
      $('#thank-you-popup').fadeIn(300).delay(2000).fadeOut(300);
    });
  
    // Allow the user to manually close the popup
    $('#close-popup').on('click', function(){
      $('#thank-you-popup').fadeOut(300);
    });
  });
</script>
